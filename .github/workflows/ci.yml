name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx nx build
      - run: npx nx test

  mongo:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/prospex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Wait for MongoDB
        run: |
          node - <<'NODE'
          const mongoose = require('mongoose');
          (async () => {
            for (let i = 0; i < 30; i++) {
              try {
                await mongoose.connect(process.env.MONGO_URI);
                console.log('mongo ready');
                await mongoose.disconnect();
                process.exit(0);
              } catch (error) {
                await new Promise((resolve) => setTimeout(resolve, 1000));
              }
            }
            console.error('mongo did not become ready');
            process.exit(1);
          })();
          NODE
      - run: npm test
